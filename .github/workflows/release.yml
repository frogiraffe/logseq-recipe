name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm check

      - name: Package plugin
        run: |
          mkdir -p release/logseq-draft-recipe
          cp -r dist release/logseq-draft-recipe/dist
          cp package.json LICENSE README.md logo.svg release/logseq-draft-recipe/
          cd release
          zip -r ../logseq-draft-recipe-${{ github.ref_name }}.zip logseq-draft-recipe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: logseq-draft-recipe-${{ github.ref_name }}.zip
